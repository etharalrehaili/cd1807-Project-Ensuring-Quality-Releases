name: Azure Pipelines

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  python.version: '3.7.6'
  azureServiceConnectionId: 'azure-quality-releases-connection-v2'
  projectRoot: $(System.DefaultWorkingDirectory)
  environmentName: 'test'

stages:
#--------------------------------------------#
# BUILD STAGE 
#--------------------------------------------#
- stage: Build
  jobs:
  - job: BuildInfrastructure
    steps:
    #--------------------------------------------#
    # Install Terraform on the pipeline agent
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
      displayName: 'Terrafom installation'
      inputs:
        terraformVersion: '1.2.9'

    # Run Terraform Init on the pipeline agent
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: 'Terrafom init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'
        backendServiceArm: '$(azureServiceConnectionId)'
        backendAzureRmResourceGroupName: 'Azuredevops'
        backendAzureRmStorageAccountName: 'tfstate188382464'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'test.terraform.tfstate'

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: Terraform validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'

    # Generate terraform.tfvars from pipeline variables
    - task: Bash@3
      displayName: 'Generate terraform.tfvars'
      inputs:
        targetType: 'inline'
        script: |
          cat > $(System.DefaultWorkingDirectory)/terraform/environments/test/pipeline.auto.tfvars <<EOF
          subscription_id = "$(armSubscriptionId)"
          client_id = "$(armClientId)"
          client_secret = "$CLIENT_SECRET"
          tenant_id = "$TENANT_ID"
          location = "$(tfLocation)"
          resource_group = "$(tfResourceGroup)"
          application_type = "$(tfApplicationType)"
          virtual_network_name = "$(tfVnetName)"
          address_space = $(tfAddressSpace)
          address_prefix_test = "$(tfAddressPrefixTest)"
          admin_username = "$(tfAdminUsername)"
          EOF
      env:
        CLIENT_SECRET: $(armClientSecret)
        TENANT_ID: $(armTenantId)

    # Run Terraform Apply
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: Terraform apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'
        environmentServiceNameAzureRM: '$(azureServiceConnectionId)'

#--------------------------------------------#
# INTEGRATION TESTING STAGE (Postman/Newman)
#--------------------------------------------#
- stage: PostmanTests
  dependsOn: Build
  jobs:
  - job: RunPostmanTests
    steps:
    - task: Npm@1
      displayName: 'Install Newman'
      inputs:
        command: 'custom'
        customCommand: 'install -g newman'

    - script: |
        mkdir -p $(System.DefaultWorkingDirectory)/TestResults
        newman run automatedtesting/postman/RegressionTestSuite.json \
          --reporters cli,junit \
          --reporter-junit-export $(System.DefaultWorkingDirectory)/TestResults/regression-results.xml
      displayName: 'Run Regression Test Suite'

    - script: |
        newman run automatedtesting/postman/DataValidationTestSuite.json \
          --reporters cli,junit \
          --reporter-junit-export $(System.DefaultWorkingDirectory)/TestResults/data-validation-results.xml
      displayName: 'Run Data Validation Test Suite'

    - task: PublishTestResults@2
      displayName: 'Publish Postman Test Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(System.DefaultWorkingDirectory)/TestResults/*.xml'
        failTaskOnFailedTests: true

#--------------------------------------------#
# PACKAGE STAGE (Archive + Publish artifacts)
#--------------------------------------------#
- stage: Package
  dependsOn: Build
  jobs:
  - job: ArchiveAndPublish
    steps:
    - task: ArchiveFiles@2
      displayName: 'Archive FakeRestAPI'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/jmeter/fakerestapi'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/fakerestapi.zip'
        replaceExistingArchive: true

    - task: ArchiveFiles@2
      displayName: 'Archive Selenium Test Suite'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/selenium'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/selenium.zip'
        replaceExistingArchive: true

    - task: ArchiveFiles@2
      displayName: 'Archive JMeter Test Suite'
      inputs:
        rootFolderOrFile: '$(System.DefaultWorkingDirectory)/automatedtesting/jmeter/test-suite'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/jmeter-test-suite.zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Artifacts'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

#--------------------------------------------#
# DEPLOY STAGE
#--------------------------------------------#
- stage: Deploy
  dependsOn: Package
  jobs:
  - deployment: DeployFakeRestAPI
    displayName: 'Deploy FakeRestAPI to App Service'
    environment: 'quality-releases-vm-env'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to App Service'
            inputs:
              azureSubscription: '$(azureServiceConnectionId)'
              appType: 'webApp'
              appName: 'quality-releases-appservice'
              package: '$(Pipeline.Workspace)/drop/fakerestapi.zip'
  - deployment: DeploySeleniumToVM
    displayName: 'Deploy and Run Selenium Tests on VM'
    environment:
      name: 'quality-releases-vm-env'
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              sudo apt-get update -y
              if ! command -v google-chrome &> /dev/null; then
                wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
                sudo apt-get install -y /tmp/chrome.deb
              fi
              if ! command -v pip3 &> /dev/null; then
                sudo apt-get install -y python3-pip
              fi
              pip3 install --upgrade selenium
            displayName: 'Install Chrome and Selenium dependencies'

          - script: |
              sudo apt-get update -y
              sudo apt-get install -y unzip
              mkdir -p $(Agent.BuildDirectory)/selenium-run
              unzip -o $(Pipeline.Workspace)/drop/selenium.zip -d $(Agent.BuildDirectory)/selenium-run
            displayName: 'Unpack Selenium test suite'

          - script: |
              cd $(Agent.BuildDirectory)/selenium-run
              export HEADLESS=true
              python3 cart_test_suite.py | tee selenium-test-output.log
            displayName: 'Run Selenium cart test suite'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Selenium test log'
            inputs:
              PathtoPublish: '$(Agent.BuildDirectory)/selenium-run/selenium-test-output.log'
              ArtifactName: 'selenium-logs'
              publishLocation: 'Container'