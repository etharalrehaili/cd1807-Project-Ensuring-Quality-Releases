name: Azure Pipelines

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  python.version: '3.7.6'
  azureServiceConnectionId: 'azure-quality-releases-connection-v2'
  projectRoot: $(System.DefaultWorkingDirectory)
  environmentName: 'test'

stages:
#--------------------------------------------#
# BUILD STAGE 
#--------------------------------------------#
- stage: Build
  jobs:
  - job: BuildInfrastructure
    steps:
    #--------------------------------------------#
    # Install Terraform on the pipeline agent
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
      displayName: 'Terrafom installation'
      inputs:
        terraformVersion: '1.2.9'

    # Run Terraform Init on the pipeline agent
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: 'Terrafom init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'
        backendServiceArm: '$(azureServiceConnectionId)'
        backendAzureRmResourceGroupName: 'Azuredevops'
        backendAzureRmStorageAccountName: 'tfstate188382464'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'test.terraform.tfstate'

    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: Terraform validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'

    # Generate terraform.tfvars from pipeline variables
    - task: Bash@3
      displayName: 'Generate terraform.tfvars'
      inputs:
        targetType: 'inline'
        script: |
          cat > $(System.DefaultWorkingDirectory)/terraform/environments/test/pipeline.auto.tfvars <<EOF
          subscription_id = "$(armSubscriptionId)"
          client_id = "$(armClientId)"
          client_secret = "$CLIENT_SECRET"
          tenant_id = "$TENANT_ID"
          location = "$(tfLocation)"
          resource_group = "$(tfResourceGroup)"
          application_type = "$(tfApplicationType)"
          virtual_network_name = "$(tfVnetName)"
          address_space = $(tfAddressSpace)
          address_prefix_test = "$(tfAddressPrefixTest)"
          admin_username = "$(tfAdminUsername)"
          EOF
      env:
        CLIENT_SECRET: $(armClientSecret)
        TENANT_ID: $(armTenantId)

    # Run Terraform Apply
    - task: ms-devlabs.custom-terraform-tasks.custom-terraform-release-task.TerraformTaskV3@3
      displayName: Terraform apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/test'
        environmentServiceNameAzureRM: '$(azureServiceConnectionId)'